<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results</title>    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --bg-elevated: #222222;
            --border-color: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #666666;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --border-radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 16px 24px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        header .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .container {
            margin-top: 80px;
            padding: 24px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-bar {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 24px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: var(--bg-elevated);
        }

        .search-bar::placeholder {
            color: var(--text-muted);
        }

        .paper-group {
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            background: var(--bg-secondary);
        }

        .paper-header {
            background: var(--bg-tertiary);
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s ease;
            border-bottom: 1px solid var(--border-color);
        }

        .paper-header:hover {
            background: var(--bg-elevated);
        }

        .paper-header .toggle-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .paper-info {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            font-size: 13px;
        }

        .paper-info .subject {
            background: var(--accent-primary);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
        }

        .paper-info .score {
            background: var(--success);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
        }

        .paper-info .time {
            color: var(--text-secondary);
        }

        .paper-info .date {
            color: var(--text-muted);
        }

        .attempts {
            display: none;
            background: var(--bg-secondary);
        }

        .attempt-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .attempt-item:last-child {
            border-bottom: none;
        }

        .attempt-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .attempt-score {
            background: var(--bg-elevated);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        .attempt-time {
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .attempt-date {
            color: var(--text-muted);
        }

        .no-attempts {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 16px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }
            
            .paper-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .attempt-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>
<body>    <header>
        <div class="logo">PaperSolver</div>
        <button onclick="window.location.href='index.html'" style="background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: var(--border-radius); cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s ease; font-family: inherit;">← Back to Home</button>
    </header>
    <div class="container" id="resultsContainer">
        <!-- Results will be dynamically loaded here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const resultsContainer = document.getElementById('resultsContainer');
            const attempts = JSON.parse(localStorage.getItem('mcq_attempts')) || {};            if (Object.keys(attempts).length === 0) {
                resultsContainer.innerHTML = '<div class="no-attempts">No attempts found.<br>Complete some papers to see your results here.</div>';
                return;
            }

            // Create search bar
            const searchBar = document.createElement('input');
            searchBar.type = 'text';
            searchBar.placeholder = 'Search papers...';
            searchBar.classList.add('search-bar');
            resultsContainer.appendChild(searchBar);

            const renderResults = (filter = '') => {
                resultsContainer.querySelectorAll('.paper-group').forEach(group => group.remove());

                for (const paperKey in attempts) {
                    const paperAttempts = attempts[paperKey];

                    // Extract subject name from paperKey
                    const subjectName = paperKey.split(' ')[0];

                    // Filter by search term
                    if (filter && !paperAttempts[0].paperName.toLowerCase().includes(filter.toLowerCase())) {
                        continue;
                    }

                    const paperGroup = document.createElement('div');
                    paperGroup.classList.add('paper-group');

                    const paperHeader = document.createElement('div');
                    paperHeader.classList.add('paper-header');

                    // Find the best attempt (highest score)
                    const bestAttempt = paperAttempts.reduce((best, current) => {
                        return current.score > best.score ? current : best;
                    }, paperAttempts[0]);

                    // Convert time spent from seconds to minutes and seconds
                    const timeSpentMinutes = Math.floor(bestAttempt.timeSpent / 60);
                    const timeSpentSeconds = bestAttempt.timeSpent % 60;

                    // Create paper info section
                    const paperInfo = document.createElement('div');
                    paperInfo.classList.add('paper-info');
                    
                    paperInfo.innerHTML = `
                        <span class="subject">${subjectName}</span>
                        <span class="paper-name">${paperAttempts[0].paperName}</span>
                        <span class="score">${bestAttempt.score}/${bestAttempt.total}</span>
                        <span class="time">⏱ ${timeSpentMinutes}m ${timeSpentSeconds}s</span>
                        <span class="date">${new Date(bestAttempt.date).toLocaleDateString()}</span>
                    `;

                    const toggleIcon = document.createElement('span');
                    toggleIcon.classList.add('toggle-icon');
                    toggleIcon.textContent = '+';

                    paperHeader.appendChild(paperInfo);
                    paperHeader.appendChild(toggleIcon);

                    const attemptsList = document.createElement('div');
                    attemptsList.classList.add('attempts');

                    paperAttempts.forEach((attempt, index) => {
                        const attemptItem = document.createElement('div');
                        attemptItem.classList.add('attempt-item');

                        const attemptInfo = document.createElement('div');
                        attemptInfo.classList.add('attempt-info');

                        const attemptTimeSpentMinutes = Math.floor(attempt.timeSpent / 60);
                        const attemptTimeSpentSeconds = attempt.timeSpent % 60;
                        
                        attemptInfo.innerHTML = `
                            <span class="attempt-date">${new Date(attempt.date).toLocaleDateString()} ${new Date(attempt.date).toLocaleTimeString()}</span>
                            <span class="attempt-time">${attemptTimeSpentMinutes}m ${attemptTimeSpentSeconds}s</span>
                        `;

                        const attemptScore = document.createElement('div');
                        attemptScore.classList.add('attempt-score');
                        attemptScore.textContent = `${attempt.score}/${attempt.total}`;

                        attemptItem.appendChild(attemptInfo);
                        attemptItem.appendChild(attemptScore);
                        attemptsList.appendChild(attemptItem);
                    });

                    paperHeader.addEventListener('click', function() {
                        const isVisible = attemptsList.style.display === 'block';
                        attemptsList.style.display = isVisible ? 'none' : 'block';
                        toggleIcon.textContent = isVisible ? '+' : '-';
                    });

                    paperGroup.appendChild(paperHeader);
                    paperGroup.appendChild(attemptsList);
                    resultsContainer.appendChild(paperGroup);
                }

                if (resultsContainer.querySelectorAll('.paper-group').length === 0 && filter) {
                    const noResults = document.createElement('div');
                    noResults.className = 'no-attempts';
                    noResults.textContent = 'No papers found matching your search.';
                    resultsContainer.appendChild(noResults);
                }
            };

            // Initial render
            renderResults();

            // Add search functionality
            searchBar.addEventListener('input', function() {
                renderResults(searchBar.value);
            });
        });
    </script>
</body>
</html>
